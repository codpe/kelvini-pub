<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Kelvini</title>
    <!-- An inline icon (a lifted lawn), so no page asks its server for /favicon.ico. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e9e6df'/%3E%3Cpath d='M4 21c6-9 18-9 24 0v4H4z' fill='%234f7f4a'/%3E%3C/svg%3E" />
    <!--
      The loading screen's look, here and not in a stylesheet so the first paint has it before anything is fetched.
      The block #boot below shows while the program loads; the app's <Loading> (src/hud/Loading.tsx) uses the same
      classes and takes its place with the real progress.
    -->
    <style>.boot{z-index:50;color:#1f2a24;background:#eef1ec;justify-content:center;align-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:opacity .45s;display:flex;position:fixed;inset:0}.boot--out{opacity:0;pointer-events:none}.boot-box{width:min(320px,72vw)}.boot-name{letter-spacing:.02em;margin-bottom:18px;font-size:28px;font-weight:600}.boot-bar{background:#1f2a241f;border-radius:2px;height:4px;overflow:hidden}.boot-fill{transform-origin:0;will-change:transform;background:#2f6f4f;width:100%;height:100%;transition:transform .25s ease-out;transform:scaleX(.08)}.boot-row{color:#5b6a61;justify-content:space-between;gap:12px;min-height:18px;margin-top:10px;font-size:13px;line-height:18px;display:flex}.boot-pct{font-variant-numeric:tabular-nums;color:#1f2a24;white-space:nowrap}.boot--wait .boot-fill{animation:1.2s ease-in-out infinite alternate boot-wait}@keyframes boot-wait{0%{opacity:.4}to{opacity:1}}@media (prefers-reduced-motion:reduce){.boot,.boot-fill{transition:none}.boot--wait .boot-fill{animation:none}}html:lang(en) .boot [lang=lv],html:not(:lang(en)) .boot [lang=en]{display:none}</style>
    <!-- The language kept from the last visit (the app's store, src/state/store.ts), so the first words are in it. -->
    <script>
      try {
        var kept = JSON.parse(localStorage.getItem('kelvini.presentation') || '{}');
        if (kept && kept.state && kept.state.language === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-5ibcUxtZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-oJnF4rW5.css">
  </head>
  <body>
    <div id="boot" class="boot boot--wait" role="status">
      <div class="boot-box">
        <div class="boot-name">Kelvini</div>
        <div class="boot-bar"><div class="boot-fill"></div></div>
        <div class="boot-row">
          <span class="boot-step"><span lang="lv">Ielādē programmu</span><span lang="en">Loading the program</span></span>
          <span class="boot-pct"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
